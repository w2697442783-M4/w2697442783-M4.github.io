<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a1f1f">
<title>课堂听译 · 俄语实时翻译与总结</title>
<style>
  :root{
    --ink:#221a1a; --mut:#7a6a6a; --acc:#7a1f1f; --acc2:#c0392b;
    --bg:#f7f1ec; --card:#fff; --line:#e5d9d2; --ok:#0a7a42; --warn:#b3540e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;padding:12px 12px 46px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:21px;margin:4px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;
    box-shadow:0 1px 3px rgba(34,26,26,.05)}
  .card h2{font-size:15px;margin:0 0 8px}
  .banner{background:#fdf3e3;border:1px solid #e8c98a;color:#7a4d12;border-radius:12px;
    padding:10px 12px;font-size:13px;margin-top:12px;display:none}
  .banner.show{display:block}
  .banner b{color:#5f3a08}
  .microw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #btnMic{
    border:none;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#fff;font-family:inherit;min-width:170px;
  }
  #btnMic.on{background:var(--acc2);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}70%{box-shadow:0 0 0 14px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
  .dot{width:11px;height:11px;border-radius:50%;background:#cbb;flex:none}
  .dot.on{background:#e03131;box-shadow:0 0 8px #e03131}
  .status{font-size:13px;color:var(--mut)}
  .status.warn{color:var(--warn)} .status.ok{color:var(--ok)}
  .diag{font-size:12px;color:#a08b8b;margin-top:6px;white-space:pre-wrap;word-break:break-all}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  button.mini{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:9px;
    padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button.mini:active{background:#f6e9e6}
  select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff;font-family:inherit}
  label.small{font-size:12px;color:var(--mut)}
  progress{width:100%;height:8px;display:none;margin-top:8px}
  #interim{color:#a08b8b;font-style:italic;min-height:24px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
  .seg{border-top:1px dashed var(--line);padding:8px 0}
  .seg:first-of-type{border-top:none}
  .seg .ru{font-size:14px;color:#6b5a5a}
  .seg .zh{font-size:17px;margin-top:1px}
  .seg .zh.wait{color:#b9a;font-size:14px}
  #feed{max-height:52vh;overflow-y:auto}
  .sum-item{border-top:1px dashed var(--line);padding:8px 0}
  .sum-item:first-of-type{border-top:none}
  .sum-ru{font-size:14px;color:#6b5a5a}
  .sum-zh{font-size:16px;color:var(--acc)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#f9e8e4;color:var(--acc);border-radius:20px;padding:2px 10px;font-size:12px}
  .small{font-size:12px;color:var(--mut)}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
  a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>课堂听译 · 俄语实时翻译</h1>
  <p class="sub">点「开始听译」，把手机放在桌上：老师讲的俄语会实时转成文字、翻成中文，并滚动总结要点。</p>

  <div class="banner" id="envBanner"></div>

  <section class="card">
    <div class="row" style="margin-top:0">
      <label class="small" for="engineSel">识别引擎</label>
      <select id="engineSel">
        <option value="whisper" selected>高准 · Whisper（俄语更准，首次需下载模型）</option>
        <option value="webspeech">实时 · 浏览器识别（出字快，准确率一般）</option>
      </select>
    </div>
    <div class="microw" style="margin-top:10px">
      <button id="btnMic" type="button">🎙 开始听译</button>
      <span class="dot" id="dot"></span>
      <span class="status" id="status">未开始</span>
    </div>
    <progress id="prog" max="100" value="0"></progress>
    <div class="diag" id="diag"></div>
    <div class="row">
      <label style="display:flex;gap:6px;align-items:center" class="small">
        <input type="checkbox" id="autoScroll" checked> 自动滚动
      </label>
      <label style="display:flex;gap:6px;align-items:center" class="small">
        <input type="checkbox" id="autoSum" checked> 自动总结（每 6 句）
      </label>
      <button class="mini" id="btnSum" type="button">立即总结</button>
      <button class="mini" id="btnCopy" type="button">复制全部记录</button>
      <button class="mini" id="btnClear" type="button">清空</button>
    </div>
    <p class="small">高准模式：Whisper 模型在本机运行，每约 10 秒转写一段，声音小会自动放大再识别，延迟十几秒但俄语准确得多，下载一次后可离线识别。实时模式出字快、准确率看系统听写脸色。两种模式都要求：用 <b>Safari</b> 打开、允许麦克风、屏幕常亮。</p>
  </section>

  <section class="card">
    <h2>要点总结（滚动更新）</h2>
    <div id="sumBox"><p class="small">开始听译后，这里会提炼老师讲的关键句（俄语 + 中文）。</p></div>
    <div class="chips" id="kwBox"></div>
  </section>

  <section class="card">
    <h2>实时记录</h2>
    <div id="interim">（老师还没开口…）</div>
    <div id="feed"></div>
  </section>

  <p class="foot">翻译走 MyMemory 免费接口，总结在本地完成。文字版（粘贴文本翻译）在 <a href="../ru-translator/">这里</a>。</p>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const feed=$("feed"), interimEl=$("interim"), statusEl=$("status"), dot=$("dot"), diagEl=$("diag"), progEl=$("prog");
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setStatus(t,cls){statusEl.textContent=t;statusEl.className="status"+(cls?" "+cls:"");}
function diag(t){ diagEl.textContent=t; }

/* ---------- 环境自检 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const banner=$("envBanner");
function showBanner(html){ banner.innerHTML=html; banner.classList.add("show"); }
if(isIOS){
  showBanner("iPhone 提示：① 必须在 <b>Safari</b> 里打开（App 内置浏览器不行，点指南针图标转到 Safari）；② 「设置 → 通用 → 键盘 → 启用听写」打开（实时模式要用）；③ 保持前台、屏幕常亮。");
}

/* ---------- 句子与总结（本地） ---------- */
function splitSentences(text){
  const clean=text.replace(/\s+/g," ").trim(); if(!clean) return [];
  const parts=clean.match(/[^.!?…]+(?:[.!?…]+["»”)]*)?/g)||[clean];
  return parts.map(s=>s.trim()).filter(Boolean);
}
const STOP=new Set(("и в на с по для не что он она они мы вы это как а но из у к о об от до при за про над под без через после перед между также уже ещё только если когда где который которая которые которого которой этом эта этот эти того там здесь очень можно надо нужно было будет были есть быть стал более менее него неё них ему ей им нас вас мне тебе себе чем тем сам себя мой твой наш ваш свой один одна одни два три же бы ли ведь даже хотя потому поэтому тогда теперь всегда никогда иногда часто потом сначала наконец например конечно может могут должен должна должны около возле среди против вместо кроме благодаря несмотря согласно").split(" "));
function wordsOf(s){return (s.toLowerCase().match(/[a-zа-яё]+/gi)||[]).filter(w=>w.length>2&&!STOP.has(w));}
function summarize(text,n){
  const sents=splitSentences(text); if(!sents.length) return {items:[],keywords:[]};
  const freq=new Map(); sents.forEach(s=>wordsOf(s).forEach(w=>freq.set(w,(freq.get(w)||0)+1)));
  const keywords=[...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  if(sents.length<=n) return {items:sents.map((s,i)=>({ru:s,idx:i})),keywords};
  const scored=sents.map((s,i)=>{
    const ws=wordsOf(s);
    let sc=ws.reduce((a,w)=>a+(freq.get(w)||0),0)/Math.sqrt(Math.max(ws.length,1));
    if(/\d/.test(s)) sc*=1.2;
    const caps=(s.match(/[А-ЯЁ][а-яё]+/g)||[]).length; sc*=(1+Math.min(caps,4)*0.06);
    return {ru:s,idx:i,sc};
  });
  const top=scored.slice().sort((a,b)=>b.sc-a.sc).slice(0,n).sort((a,b)=>a.idx-b.idx);
  return {items:top,keywords};
}

/* ---------- 翻译（队列 + 缓存） ---------- */
const zhCache=new Map();
let tQueue=Promise.resolve();
function translateQueued(text){
  const key=text.trim();
  if(zhCache.has(key)) return Promise.resolve(zhCache.get(key));
  const job=tQueue.then(()=>translateRaw(key)).then(zh=>{ zhCache.set(key,zh); return zh; });
  tQueue=job.catch(()=>{});
  return job;
}
async function translateRaw(q){
  if(q.length>420){
    const chunks=[]; let cur="";
    for(const s of splitSentences(q)){ if((cur+" "+s).length>420&&cur){chunks.push(cur);cur=s;} else cur=cur?cur+" "+s:s; }
    if(cur) chunks.push(cur);
    const parts=[]; for(const c of chunks) parts.push(await translateRaw(c));
    return parts.join(" ");
  }
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair=ru%7Czh-CN";
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json(); const t=(d&&d.responseData&&d.responseData.translatedText)||"";
  if(/MYMEMORY WARNING|QUOTA|INVALID/i.test(t)) throw new Error("翻译额度用完或接口受限");
  if(!t) throw new Error("翻译返回为空");
  return t;
}

/* ---------- 实时记录 ---------- */
let segments=[], segSinceSum=0, gotAnyResult=false, watchdog=null;
function addSegment(ru){
  const clean=ru.trim(); if(!clean) return;
  gotAnyResult=true;
  const seg={ru:clean, zh:null}; segments.push(seg);
  const div=document.createElement("div"); div.className="seg";
  div.innerHTML='<div class="ru">'+escapeHtml(clean)+'</div><div class="zh wait">翻译中…</div>';
  feed.appendChild(div); seg.el=div.querySelector(".zh");
  if($("autoScroll").checked) div.scrollIntoView({behavior:"smooth",block:"end"});
  translateQueued(clean).then(zh=>{
    seg.zh=zh; seg.el.textContent=zh; seg.el.classList.remove("wait");
  }).catch(e=>{ seg.el.textContent="（翻译失败："+e.message+"）"; });
  segSinceSum++;
  if($("autoSum").checked && segSinceSum>=6){ segSinceSum=0; runSummary(); }
}
async function runSummary(){
  const full=segments.map(s=>s.ru).join(" ");
  const n = segments.length>14 ? 5 : 3;
  const sum=summarize(full,n);
  if(!sum.items.length) return;
  const box=$("sumBox");
  box.innerHTML=sum.items.map((it,i)=>'<div class="sum-item"><div class="sum-ru">'+(i+1)+". "+escapeHtml(it.ru)+'</div><div class="sum-zh" data-k="'+i+'">…</div></div>').join("");
  $("kwBox").innerHTML=sum.keywords.map(k=>'<span class="chip">'+escapeHtml(k)+"</span>").join("");
  for(let i=0;i<sum.items.length;i++){
    try{ const zh=await translateQueued(sum.items[i].ru);
      const el=box.querySelector('[data-k="'+i+'"]'); if(el) el.textContent=zh;
    }catch(e){ const el=box.querySelector('[data-k="'+i+'"]'); if(el) el.textContent="（暂未译出）"; }
  }
}
</script>
<script>
"use strict";
/* ================= 引擎 A：浏览器识别（实时） ================= */
let rec=null, wantListen=false, restartTimer=null;
function wsStart(){
  if(!SR){ setStatus("此浏览器不支持实时模式，请用高准模式","warn"); wantListen=false; syncMicUI(); return; }
  rec=new SR();
  rec.lang="ru-RU";
  rec.continuous=!isIOS;
  rec.interimResults=true;
  rec.maxAlternatives=1;
  rec.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) addSegment(r[0].transcript);
      else interim+=r[0].transcript;
    }
    interimEl.textContent=interim||"（聆听中…）";
    setStatus("聆听中…","ok");
  };
  rec.onerror=e=>{
    const code=e.error||"unknown";
    if(code==="not-allowed"||code==="service-not-allowed"){
      wantListen=false; syncMicUI();
      setStatus("麦克风/听写权限被拒绝","warn");
      diag("解决：① 用 Safari 打开；② 设置 → Safari → 麦克风 允许；③ 设置 → 通用 → 键盘 → 启用听写 打开。再重新开始。");
      return;
    }
    if(code==="audio-capture") diag("没有检测到麦克风输入。");
    else if(code==="network") diag("识别服务网络波动（network），自动重试中…");
    else if(code!=="no-speech") diag("识别事件："+code+"（已自动处理）");
  };
  rec.onend=()=>{
    dot.classList.remove("on");
    if(wantListen){
      clearTimeout(restartTimer);
      restartTimer=setTimeout(()=>{ if(wantListen) wsStart(); }, isIOS?120:300);
    }else setStatus("已停止");
  };
  try{ rec.start(); dot.classList.add("on"); setStatus("聆听中（实时模式）…","ok"); }catch(_){}
}
function wsStop(){ try{ rec && rec.stop(); }catch(_){} }

/* ================= 引擎 B：Whisper 高准（PCM 直采 + 队列转写 + 自愈） ================= */
let transcriber=null, whisperLoading=false;
let micStream=null, actx=null, srcNode=null, procNode=null;
let pcmParts=[], pcmLen=0, capTimer=null, capSec=0, lastRms=0;
let txChain=Promise.resolve(), txPending=0, txSkipped=0;
let healUsed=false, healing=false, silentChunks=0;
const TARGET_SR=16000, CHUNK_SEC=10;
async function loadWhisper(){
  if(transcriber) return true;
  if(whisperLoading) return false;
  whisperLoading=true;
  progEl.style.display="block"; progEl.value=0;
  setStatus("正在加载 Whisper 模型…");
  diag("模型在本机运行，转写不上传录音。首次约 80MB，之后走缓存。");
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2/dist/transformers.min.js");
    mod.env.allowLocalModels=false;
    const onProg=p=>{
      if(p && p.status==="progress" && p.total){
        progEl.value=Math.round(p.loaded/p.total*100);
        setStatus("下载模型中… "+Math.round(p.loaded/p.total*100)+"%");
      }
    };
    transcriber=await mod.pipeline("automatic-speech-recognition","Xenova/whisper-base",{dtype:"q8",device:"wasm",progress_callback:onProg});
    progEl.style.display="none";
    diag("模型就绪 ✓");
    return true;
  }catch(e){
    progEl.style.display="none";
    setStatus("模型下载失败","warn");
    diag("失败："+(e && e.message? e.message:e)+"。多半是网络到 CDN/HuggingFace 不通，换网络重试或先用实时模式。");
    return false;
  }finally{ whisperLoading=false; }
}
function downsample(input, inRate){
  if(inRate===TARGET_SR) return new Float32Array(input);
  const ratio=inRate/TARGET_SR;
  const outLen=Math.floor(input.length/ratio);
  const out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const start=Math.floor(i*ratio), end=Math.min(input.length, Math.floor((i+1)*ratio));
    let s=0; for(let j=start;j<end;j++) s+=input[j];
    out[i]=s/Math.max(1,(end-start));
  }
  return out;
}
function bufRms(a){ let s=0; for(let i=0;i<a.length;i+=4) s+=a[i]*a[i]; return Math.sqrt(s/Math.max(1,Math.floor(a.length/4))); }
function bufPeak(a){ let p=0; for(let i=0;i<a.length;i+=2){ const v=Math.abs(a[i]); if(v>p) p=v; } return p; }
function amplify(audio){
  const pk=bufPeak(audio);
  if(pk<0.001) return 1;
  const g=Math.min(0.92/pk, 30);
  if(g>1.05){ for(let i=0;i<audio.length;i++) audio[i]*=g; }
  return g;
}
function takePcm(){
  if(!pcmLen) return null;
  const all=new Float32Array(pcmLen);
  let off=0;
  for(const part of pcmParts){ all.set(part,off); off+=part.length; }
  pcmParts=[]; pcmLen=0;
  return all;
}
function levelBars(r){
  const bars="▁▂▃▄▅▆▇█";
  const idx=Math.max(0,Math.min(7,Math.floor(r*30)));
  return bars[idx];
}
function txStatus(){
  setStatus("聆听中（高准）· 已录 "+Math.floor(capSec/60)+":"+String(capSec%60).padStart(2,"0")+
    " · 已出 "+segments.length+" 段"+(txPending? " · 转写中 "+txPending:"")+(txSkipped? " · 已跳过 "+txSkipped+" 段":""), "ok");
  interimEl.textContent="🎙 当前音量 "+levelBars(lastRms)+" "+lastRms.toFixed(4)+"（说话时会动；一直 0.000x 就是麦克风没进声）";
}
function enqueueTx(audio){
  if(txPending>=3){ txSkipped++; diag("转写速度跟不上，已跳过较早的 "+txSkipped+" 段音频（不影响继续录音）。"); return; }
  txPending++;
  txChain=txChain.then(async()=>{
    const t0=Date.now();
    try{
      const out=await transcriber(audio,{language:"russian",task:"transcribe"});
      const text=((out && out.text)||"").trim();
      if(text && !/^\[.*\]$/.test(text) && !/^\(.*\)$/.test(text)) addSegment(text);
      diag("最近一段转写耗时 "+Math.round((Date.now()-t0)/1000)+" 秒 ✓");
    }catch(e){
      diag("转写出错一次："+(e && e.message? e.message:e));
    }
    txPending--;
  }).catch(()=>{ txPending--; });
}
function closeMic(){
  try{ procNode && procNode.disconnect(); }catch(_){}
  try{ srcNode && srcNode.disconnect(); }catch(_){}
  try{ actx && actx.close(); }catch(_){}
  procNode=null; srcNode=null; actx=null;
  if(micStream){ micStream.getTracks().forEach(t=>{ try{t.stop();}catch(_){} }); micStream=null; }
  pcmParts=[]; pcmLen=0;
}
async function openMic(){
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
  const tr=micStream.getAudioTracks()[0];
  if(tr){
    tr.onmute=()=>diag("⚠ 系统把麦克风静音了：通常是被别的 App 或另一个标签页占用。关掉其他「课堂听译」标签和在用麦克风的 App（语音类），再点停止→开始。");
    tr.onunmute=()=>diag("麦克风恢复进声 ✓");
    if(tr.muted) diag("⚠ 麦克风当前就是静音状态（被占用）。关掉其他在用麦克风的 App/标签，再点停止→开始。");
  }
  actx=new (window.AudioContext||window.webkitAudioContext)();
  await actx.resume();
  srcNode=actx.createMediaStreamSource(micStream);
  procNode=actx.createScriptProcessor(4096,1,1);
  const inRate=actx.sampleRate;
  procNode.onaudioprocess=e=>{
    if(!wantListen) return;
    const ch=e.inputBuffer.getChannelData(0);
    lastRms=bufRms(ch);
    const ds=downsample(ch, inRate);
    pcmParts.push(ds); pcmLen+=ds.length;
  };
  srcNode.connect(procNode);
  procNode.connect(actx.destination);
}
async function healMic(){
  if(healing || !wantListen) return;
  healing=true;
  diag("连续检测不到声音，正在自动重新获取麦克风…");
  closeMic();
  try{ await openMic(); diag("麦克风已重新获取，对着设备说句话看音量条。"); }
  catch(e){ diag("重新获取麦克风失败："+(e && e.message? e.message:e)+"。请手动点停止→开始。"); }
  healing=false;
}
async function whisperStart(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("当前环境拿不到麦克风","warn");
    diag("多半是在 App 内置浏览器里打开的。请点指南针图标，在 Safari 里打开本页。");
    wantListen=false; syncMicUI(); return;
  }
  const ok=await loadWhisper();
  if(!ok || !wantListen){ wantListen=false; syncMicUI(); return; }
  try{ await openMic(); }
  catch(e){
    setStatus("麦克风被拒绝","warn");
    diag("请在 Safari 设置里允许本页使用麦克风，然后重新开始。");
    wantListen=false; syncMicUI(); return;
  }
  dot.classList.add("on");
  capSec=0; silentChunks=0; healUsed=false;
  txStatus();
  diag("已开始录音。每约 "+CHUNK_SEC+" 秒切一段转写。先对着设备大声说一句俄语，看「当前音量」跳不跳。");
  clearInterval(capTimer);
  capTimer=setInterval(async ()=>{
    if(!wantListen) return;
    capSec++;
    if(actx && actx.state==="suspended"){ actx.resume().catch(()=>{}); }
    if(pcmLen>=TARGET_SR*CHUNK_SEC && !healing){
      const audio=takePcm();
      if(audio){
        const r=bufRms(audio), pk=bufPeak(audio);
        if(pk<0.002){ silentChunks++; } else { silentChunks=0; }
        if(silentChunks>=2 && !healUsed){
          healUsed=true; silentChunks=0;
          healMic();
        }else if(pk<0.012 && r<0.0012){
          diag("刚过去的 "+CHUNK_SEC+" 秒确实没声，已跳过（峰值 "+pk.toFixed(3)+"）。");
        }else{
          const g=amplify(audio);
          if(g>1.6) diag("声音偏小（峰值 "+pk.toFixed(3)+"），已自动放大 ×"+g.toFixed(1)+" 再识别。把设备放近讲台会更准。");
          enqueueTx(audio);
        }
      }
    }
    txStatus();
  },1000);
}
function whisperStop(){
  clearInterval(capTimer); capTimer=null;
  closeMic();
  dot.classList.remove("on");
}

/* ================= 统一开关 ================= */
function syncMicUI(){
  $("btnMic").textContent = wantListen? "⏹ 停止听译":"🎙 开始听译";
  $("btnMic").classList.toggle("on", wantListen);
  $("engineSel").disabled = wantListen;
  if(!wantListen) dot.classList.remove("on");
}
function armWatchdog(){
  clearTimeout(watchdog);
  watchdog=setTimeout(()=>{
    if(wantListen && !gotAnyResult){
      setStatus("还没出任何一段","warn");
      diag("开始 45 秒了还没出字。自查：① 在 Safari 打开；② 说话时「当前音量」会不会离开 0.000x——不动就是麦克风被别的 App/标签占用，先关掉它们再开始。");
    }
  },45000);
}
$("btnMic").addEventListener("click", async ()=>{
  if(wantListen){
    wantListen=false;
    clearTimeout(restartTimer); clearTimeout(watchdog);
    wsStop(); whisperStop();
    syncMicUI(); setStatus("已停止"); diag("");
    return;
  }
  wantListen=true; gotAnyResult=false;
  syncMicUI(); diag("");
  const engine=$("engineSel").value;
  if(engine==="whisper"){ armWatchdog(); await whisperStart(); if(!wantListen) syncMicUI(); }
  else{
    if(!SR){ showBanner("⚠ 当前浏览器不支持「实时模式」。请改用<b>高准 · Whisper</b> 模式，或用 Safari 打开本页。"); wantListen=false; syncMicUI(); return; }
    armWatchdog(); wsStart();
  }
});
$("btnSum").addEventListener("click", runSummary);
$("btnClear").addEventListener("click", ()=>{
  segments=[]; segSinceSum=0; feed.innerHTML=""; interimEl.textContent="（老师还没开口…）";
  $("sumBox").innerHTML='<p class="small">开始听译后，这里会提炼老师讲的关键句（俄语 + 中文）。</p>'; $("kwBox").innerHTML="";
});
$("btnCopy").addEventListener("click", e=>{
  const text=segments.map(s=>(s.zh? s.ru+"\n"+s.zh : s.ru)).join("\n");
  if(!text) return;
  const btn=e.target, done=()=>{ const o=btn.textContent; btn.textContent="已复制 ✓"; setTimeout(()=>btn.textContent=o,1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>{});
});
</script>
